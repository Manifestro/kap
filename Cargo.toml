[workspace]
resolver = "2"
members = ["crates/kap-core", "crates/kap-cli"]

[workspace.package]
version = "0.1.4-test-1"
edition = "2021"
license = "MIT"
authors = ["Manifestro"]
repository = "https://github.com/Manifestro/kap"
homepage = "https://github.com/Manifestro/kap"
keywords = ["agents", "ai", "versioning", "provenance"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
kap-core = { path = "crates/kap-core", version = "0.1.4-test-1" }

clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
ulid = "3"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

tempfile = "3"
